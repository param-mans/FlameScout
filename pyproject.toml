[project]
name = "flamescout"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.7",
  "fastapi",
  "uvicorn[standard]",
  "deepagents",
  "langchain-google-genai",
  "langchain-openai",
  "langsmith",
  "python-dotenv",
  "pyyaml",
  "pymongo>=4.6",
  "psycopg[binary,pool]>=3.2",
  "langgraph-checkpoint-postgres",
  "httpx",
]

[project.optional-dependencies]
dev = ["pytest", "mongomock", "websockets"]

[tool.pytest.ini_options]
pythonpath = [".", "packages/schemas"]
testpaths = ["tests"]
markers = ["live: calls a real API; runs only with RUN_LIVE=1"]

[tool.setuptools]
# Install dependencies only; code is imported via pythonpath (pytest) and sys.path (scripts).
packages = []
